# Развёртывание стенда на отдельной машине.
# Проверено: конфигурация, сборка образа, запуск ноутбука на целевой машине.
# Не проверено: расчёт на ускорителе внутри контейнера.
#
# Запуск:
#   cd docker
#   cp .env.example .env      и вписать свой токен
#   docker compose up -d --build
#   docker compose logs -f stand
#
# Открыть: http://<адрес машины>:${JUPYTER_PORT}/lab?token=<токен из .env>

services:
  stand:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sfu-cv-stand:latest
    container_name: sfu-cv-stand
    restart: unless-stopped

    # Загрузчики данных держат кадры в разделяемой памяти.
    # Значения по умолчанию у Docker малы, отсюда явное указание.
    shm_size: "8gb"

    ports:
      - "${JUPYTER_PORT:-8888}:8888"

    # Целевая машина работает под RedOS, и там в настройках доступа к ускорителю
    # выставлено no-cgroups = true (файл /etc/nvidia-container-runtime/config.toml).
    # При этом обычный проброс не выдаёт контейнеру права на устройства ускорителя,
    # и он их не видит. Лечится полными правами. Так же сделано в рабочем
    # развёртывании соседнего сервиса на этой же машине.
    privileged: true
    runtime: nvidia

    # Замена полным правам, если они нежелательны: перечислить устройства явно.
    # На машине без ускорителя обе записи придётся убрать, иначе запуск не пройдёт.
    # devices:
    #   - "/dev/nvidia0:/dev/nvidia0"
    #   - "/dev/nvidiactl:/dev/nvidiactl"
    #   - "/dev/nvidia-uvm:/dev/nvidia-uvm"

    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?задайте токен в .env}
      HF_HOME: /cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Здесь стояло отключение обезличенной статистики хранилища моделей.
      # Убрано намеренно: при нём пакет ускоренных операций собирает пустую
      # строку в заголовок запроса, заголовок выходит недопустимым, проверка
      # издателя падает, и обработка контуров молча пропускается. Замерено
      # в контейнере. Весов это не касается, они лежат локально.

    volumes:
      # Код и ноутбуки. Правки видны сразу, пересборка не нужна.
      - ../stand:/workspace/stand:ro
      - ../notebooks:/workspace/notebooks
      - ../tools:/workspace/tools:ro
      - ../docs:/workspace/docs:ro

      # Данные и модели лежат снаружи образа: вместе они весят около 4,3 ГБ.
      # Пути внутри контейнера менять нельзя, вспомогательный код ищет их
      # относительно своего расположения.
      - ${DATA_PATH:-../data}:/workspace/data
      - ${MODELS_PATH:-../models}:/workspace/models

      # Кеш загруженных моделей переживает пересоздание контейнера.
      - hf-cache:/cache/huggingface

    # Запрос ускорителя. Та же запись, что в рабочем развёртывании на 118.
    # Одной её мало: без строк privileged и runtime выше контейнер ускоритель
    # не увидит.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  hf-cache:
